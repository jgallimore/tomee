#
# OpenTelemetry declarative (file) configuration document, bundled at the root of
# the reproducer war so that otel.config.file has a real file to point at.
#
# Parsing it requires the opentelemetry-sdk-extension-declarative-config module,
# which TomEE does not bundle - which is exactly the failure this reproducer
# provokes. See README.adoc.

# Schema version of this document. Use the value that matches the SDK on your
# server (0.4 is current for the OpenTelemetry 1.62.0 line); bump it if the SDK
# rejects it as unsupported.
file_format: "0.4"

# Master switch. false => the SDK is enabled (equivalent to otel.sdk.disabled=false).
disabled: false

# Attributes describing this service, attached to every span.
resource:
  attributes:
    - name: service.name
      value: mp-telemetry-tracing

# Context propagation across process boundaries (W3C trace context + baggage).
propagator:
  composite:
    - tracecontext
    - baggage

# Tracing pipeline: batch spans and write them to stdout.
tracer_provider:
  processors:
    - batch:
        exporter:
          console: {}
