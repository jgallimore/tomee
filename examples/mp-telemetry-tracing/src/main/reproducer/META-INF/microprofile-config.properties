# ---------------------------------------------------------------------------
# REPRODUCER configuration (built with `mvn -Preproducer ...`).
#
# It is identical to the normal example config except for the otel.config.file
# property below, which asks OpenTelemetry to autoconfigure from a declarative
# (YAML) config file. That file-based configuration lives in a separate module,
# opentelemetry-sdk-extension-declarative-config, which TomEE does NOT bundle.
# When the SmallRye producer builds the SDK, OpenTelemetry autoconfigure sees
# the property and fails with:
#
#   io.opentelemetry.sdk.autoconfigure.spi.ConfigurationException:
#     Cannot autoconfigure from config file without
#     opentelemetry-sdk-extension-declarative-config on the classpath
#
# SmallRye forwards MicroProfile Config "otel.*" properties into OpenTelemetry
# autoconfigure, so setting it here (in the war) is enough on OpenTelemetry
# 1.62.0. See README.adoc for the details and for the alternative of setting it
# as a JVM system property / environment variable.
# ---------------------------------------------------------------------------

otel.sdk.disabled=false
otel.service.name=mp-telemetry-tracing

otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none

# The trigger. The value is a path to a declarative-config YAML file; a copy is
# bundled at the root of this war as otel-config.yaml.
otel.config.file=otel-config.yaml
