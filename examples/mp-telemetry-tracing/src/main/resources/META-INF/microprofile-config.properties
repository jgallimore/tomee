# MicroProfile Telemetry is disabled by default; this switches it on for the app.
otel.sdk.disabled=false

# Name reported for this service in the emitted traces.
otel.service.name=mp-telemetry-tracing

# Keep the example self-contained: create and record spans, but do not try to
# push them to an external collector. Point otel.traces.exporter at "otlp" (the
# default) and configure an endpoint to send traces to a real backend.
otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none
