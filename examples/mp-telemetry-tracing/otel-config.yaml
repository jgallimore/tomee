#
# OpenTelemetry declarative (file) configuration document.
#
# Point the SDK at this file with either:
#   -Dotel.config.file=/absolute/path/to/otel-config.yaml
#   OTEL_CONFIG_FILE=/absolute/path/to/otel-config.yaml
#
# On a TomEE build that does NOT ship opentelemetry-sdk-extension-declarative-config
# (the renamed -incubator module), simply having this property set makes the SDK
# build fail with:
#   ConfigurationException: Cannot autoconfigure from config file without
#     opentelemetry-sdk-extension-declarative-config on the classpath
#
# Once that module IS on the classpath, this document configures the SDK to emit
# spans to the console (stdout), which keeps the example self-contained.

# Schema version of this document. Use the value that matches the SDK on your
# server (0.4 is current for the OpenTelemetry 1.62.0 line); bump it if the SDK
# rejects it as unsupported.
file_format: "0.4"

# Master switch. false => the SDK is enabled (equivalent to otel.sdk.disabled=false).
disabled: false

# Attributes describing this service, attached to every span.
resource:
  attributes:
    - name: service.name
      value: mp-telemetry-tracing

# Context propagation across process boundaries (W3C trace context + baggage).
propagator:
  composite:
    - tracecontext
    - baggage

# Tracing pipeline: batch spans and write them to stdout.
tracer_provider:
  processors:
    - batch:
        exporter:
          console: {}
